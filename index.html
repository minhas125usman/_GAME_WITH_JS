<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pig Dice — Usman</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page-bg">
    <div class="board" id="board">
      <button id="btn-new" class="btn btn-top">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 6V3L8 7l4 4V8c2.76 0 5 2.24 5 5a5 5 0 11-5-5z"></path>
        </svg>
        NEW GAME
      </button>

      <div class="players">
        <section id="player-0" class="player active">
          <h2 class="player-title" id="name-0">PLAYER 1</h2>
          <div class="score" id="score-0">0</div>

          <div class="current-box">
            <div class="label">CURRENT</div>
            <div class="current" id="current-0">0</div>
          </div>
        </section>

        <div class="center-controls">
          <img id="dice-img" class="dice hidden" alt="dice" />
          <div class="center-buttons">
            <button id="btn-roll" class="btn btn-center">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2zM7 8a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm10 10a1.5 1.5 0 110-3 1.5 1.5 0 010 3zM12 14a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"/>
              </svg>
              ROLL DICE
            </button>

            <button id="btn-hold" class="btn btn-center">
              <svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path fill="currentColor" d="M12 2a10 10 0 1010 10A10.011 10.011 0 0012 2zm1 15h-2v-2h2zm0-4h-2V7h2z"/>
              </svg>
              HOLD
            </button>
          </div>
        </div>

        <section id="player-1" class="player">
          <h2 class="player-title" id="name-1">PLAYER 2</h2>
          <div class="score" id="score-1">0</div>
<!-- https://www.facebook.com/share/v/1AP6iNZMaG/ -->
          <div class="current-box">
            <div class="label">CURRENT</div>
            <div class="current" id="current-1">0</div>
          </div>
        </section>
      </div>

      <div class="footer-shadow"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
